server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # El enrutamiento lo resuelve Angular: cualquier ruta desconocida
    # devuelve index.html en vez de un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los bundles llevan hash en el nombre, así que caducan cuando cambia
    # el contenido y se pueden cachear para siempre.
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # El contenido del mural NO se cachea. Es carpeta montada desde el host:
    # cambiar una foto o un texto tiene que verse al recargar el televisor,
    # no dentro de un año.
    #
    # Sin esto, reemplazar `protagonista.jpg` por una foto nueva deja el TV
    # mostrando la vieja hasta que alguien limpie la caché del navegador,
    # que en un televisor no es una operación trivial.
    location /contenido/ {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
